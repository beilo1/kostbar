:root{color-scheme:light;--ink:#23362e;--green:#214c3c;--muted:#52645a;--line:#afc3b7}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#edf1ee;color:var(--ink);font:15px/1.45 system-ui,sans-serif}
.toolbar{position:sticky;top:0;z-index:1;background:white;border-bottom:1px solid #d2dcd5}
.toolbar-inner{max-width:226mm;margin:auto;padding:10px 16px;display:flex;gap:8px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid #b3c6bb;border-radius:7px;padding:.55em .9em;background:white;color:var(--green)}
button.primary{background:var(--green);color:white;border-color:var(--green)}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.sheet{width:210mm;min-height:297mm;margin:16px auto;padding:40pt 41pt 66pt;background:white;box-shadow:0 4px 20px #182a2226;font:9.6pt/13.1pt Jakarta,Arial,sans-serif}
.brandline{display:flex;justify-content:space-between;align-items:flex-start;gap:20pt;min-height:31pt}
.logo{display:block;width:171pt;height:28pt;flex:none}
.date{margin:5pt 0 0;color:var(--muted);font-size:9.2pt;text-align:right}
h1{margin:7pt 0 15pt;padding-bottom:10pt;border-bottom:.65pt solid var(--line);color:var(--green);font:34pt/43pt Fraunces,Georgia,serif}
.document-text{column-count:2;column-gap:25pt;overflow-wrap:anywhere}
.document-text:has(+ .print-footer:last-child){min-height:564pt}
.terms-rich{display:contents}
.placeholder{color:#6c4e33}
h2,h3{color:var(--green);margin:0 0 4pt;font-weight:400;break-after:avoid}
h2{font-size:11pt;line-height:14pt}
h3{font-size:10pt;line-height:13pt}
.document-text h2:not(:first-child){margin-top:9pt}
.document-text h3:not(:first-child){margin-top:5pt}
p,ul,ol{margin:0 0 5pt;orphans:2;widows:2}
ul,ol{padding-left:14pt}
.print-footer{margin-top:14pt;padding:9pt 13pt 8pt;border:.65pt solid var(--line);border-radius:6pt;background:#f2f6f3;break-inside:avoid;overflow-wrap:anywhere}
.print-footer h2{font-size:10pt}
.print-footer p:last-child{margin-bottom:0}
.project-notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8pt 14pt;margin-top:11pt;padding-top:8pt;border-top:.65pt solid var(--line);break-inside:avoid;overflow-wrap:anywhere}
.project-notice>div{flex:1 1 180pt;min-width:0}
.project-notice a{color:var(--green)}
.project-qr{width:63pt;height:auto;max-width:100%}
[data-editable]:hover,[data-editable]:focus{outline:1px dashed #7a9b86;outline-offset:3px}
[data-editable]{cursor:text}
@media screen and (max-width:830px){
  .sheet{width:calc(100% - 20px);min-height:0;padding:26px}
  .document-text{column-count:1}
  .document-text:has(+ .print-footer){min-height:0}
  h1{font-size:clamp(24px,7vw,45px);line-height:1.22;overflow-wrap:anywhere}
  .logo{max-width:55%;height:auto}
}
@page{size:A4 portrait;margin:14.1mm 14.46mm 15mm}
@media print{
  html,body{background:white}
  .toolbar,noscript{display:none!important}
  .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  [data-editable]{outline:none!important}
}
</style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-inner">
    <span>Text oder Standdatum anklicken und bearbeiten.</span>
    <div class="actions"><button id="save" type="button">HTML speichern</button><button class="primary" id="print" type="button">Drucken</button></div>
  </div>
</header>
<noscript>Die Datei lässt sich über das Druckmenü deines Browsers ausdrucken.</noscript>
<main class="sheet">
  <header class="brandline">
    @@LOGO@@
    <p class="date" data-editable contenteditable="plaintext-only">@@DATE@@</p>
  </header>
  <h1 data-editable contenteditable="plaintext-only">@@TITLE@@</h1>
  <article class="document-text" data-editable contenteditable="plaintext-only">@@CONTENT@@</article>
  @@FOOTER@@
  @@PROJECT@@
</main>
<script>
'use strict';
const filename='@@FILENAME@@';
const permitted=new Set(['p','div','h2','h3','ul','ol','li','strong','b','u','br']);
function copyText(node,parent){
  if(node.nodeType===Node.TEXT_NODE){
    parent.append(document.createTextNode(node.data));
  } else if(node.nodeType===Node.ELEMENT_NODE){
    const tag=node.localName;
    if(permitted.has(tag)){
      const clean=document.createElement(tag);
      if(tag==='div' && node.classList.contains('terms-rich')) clean.className='terms-rich';
      for(const child of node.childNodes) copyText(child,clean);
      parent.append(clean);
    } else if(tag==='span'){
      const clean=document.createElement('span');
      if(node.classList.contains('placeholder')) clean.className='placeholder';
      for(const child of node.childNodes) copyText(child,clean);
      parent.append(clean);
    }
  }
}
document.querySelectorAll('[data-editable]').forEach(node=>{
  node.addEventListener('drop',event=>event.preventDefault());
});
document.getElementById('print').addEventListener('click',async()=>{
  await document.fonts.ready;
  window.print();
});
document.getElementById('save').addEventListener('click',()=>{
  const snapshot=document.documentElement.cloneNode(true);
  for(const editable of snapshot.querySelectorAll('[data-editable]')){
    const clean=document.createDocumentFragment();
    for(const child of editable.childNodes) copyText(child,clean);
    editable.replaceChildren(clean);
  }
  const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+snapshot.outerHTML],{type:'text/html;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
});
</script>
</body>
</html>
